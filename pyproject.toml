[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bounty-python-template"
version = "0.1.0"
description = "Reusable Python starter for bounties (CLI, tests, CI)"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
]

[project.scripts]
app = "app.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.ruff]
line-length = 100
